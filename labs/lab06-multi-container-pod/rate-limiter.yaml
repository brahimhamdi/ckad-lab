apiVersion: v1
kind: Pod
metadata:
  name: rate-limiter
  namespace: ext-access
spec:
  containers:
  - name: business-app
    image: brahimhamdi/nodejs-business-app:1.0.0
    ports:
    - containerPort: 8080
  - name: ambassador
    image: brahimhamdi/nodejs-ambassador:1.0.0
    ports:
    - containerPort: 8081

